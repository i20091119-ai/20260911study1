<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>레이디버그 먹이 사냥</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { height: 100%; }
  body {
    font-family: 'Jua Web', 'Jua', 'Malgun Gothic', '맑은 고딕', sans-serif;
    margin: 0; overflow: hidden;
    background: #24365c;
    background-image: radial-gradient(circle at 50% 38%, #2e4577 0%, #24365c 58%, #1a2745 100%);
    color: #fff;
    display: flex; flex-direction: column;
    touch-action: none;
  }

  /* ── 기관 로고 (왼쪽 위 고정) ───────────────────────── */
  #orgLogoFixed {
    position: fixed; top: 1.5vmin; left: 1.5vmin; z-index: 80;
    background: #fff; border-radius: 1.5vmin; padding: .9vmin 1.8vmin;
  }
  #orgLogoFixed img { height: 4.6vmin; display: block; }

  /* ── 공통 ──────────────────────────────────────────── */
  .row { display: flex; align-items: center; justify-content: center; }
  .row > * + * { margin-left: 2vmin; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .col > * + * { margin-top: 2vmin; }

  .bigBtn {
    font-family: inherit; font-size: 3.6vmin; font-weight: bold; color: #fff;
    padding: 2.2vmin 6vmin; border: none; border-radius: 2vmin; cursor: pointer;
    background: #43a047; box-shadow: 0 6px 0 rgba(0,0,0,.35);
  }
  .bigBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .subBtn {
    font-family: inherit; font-size: 2.4vmin; color: #24365c; background: #ffd54f;
    padding: 1.2vmin 3.4vmin; border: none; border-radius: 1.4vmin; cursor: pointer;
    box-shadow: 0 4px 0 rgba(0,0,0,.3);
  }
  .subBtn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.3); }

  /* 꽃 배경 */
  #bgFlowers { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; }
  .flowerLayer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; overflow: hidden; }
  .flower { position: absolute; top: 0; left: 0; }
  .petal { position: absolute; border-radius: 50%; }
  .core { position: absolute; border-radius: 50%; background: #ffd54f; }
  .stem { position: absolute; background: #7cc47f; border-radius: .4vmin; }

  .screen {
    z-index: 2;
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    padding: 2vmin;
  }
  .screen.on { display: flex; }

  /* ── 시작 화면 ─────────────────────────────────────── */
  #titleText { font-size: 8.5vmin; color: #ffd54f; text-shadow: 0 .8vmin 0 rgba(0,0,0,.35); letter-spacing: .3vmin; }
  #titleSub { font-size: 3.2vmin; color: #cfe0ff; }
  .pickLabel { font-size: 3.4vmin; color: #fff; }
  .pickBtn {
    font-family: inherit; font-size: 4.6vmin; color: #fff; width: 16vmin; height: 16vmin;
    border: .6vmin solid rgba(255,255,255,.45); border-radius: 3vmin; cursor: pointer;
    background: #35508a; box-shadow: 0 6px 0 rgba(0,0,0,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .pickBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
  .pickBtn .num { font-size: 6vmin; line-height: 1; }
  .pickBtn .cap { font-size: 2.2vmin; margin-top: .8vmin; color: #cfe0ff; }

  /* 타이틀용 장식 무당벌레 */
  #titleBug { position: relative; width: 24vmin; height: 22vmin; }
  #titleBug .wg { position: absolute; top: 5vmin; width: 9vmin; height: 12vmin; background: rgba(255,255,255,.30); border-radius: 50%; }
  #titleBug .wgL { left: 0; transform: rotate(-18deg); animation: flapL 1.1s ease-in-out infinite; }
  #titleBug .wgR { right: 0; transform: rotate(18deg); animation: flapR 1.1s ease-in-out infinite; }
  #titleBug .h { position: absolute; top: 1.2vmin; left: 8.2vmin; width: 7.6vmin; height: 5vmin; background: #23272e; border-radius: 50%; }
  #titleBug .b { position: absolute; top: 4vmin; left: 5.5vmin; width: 13vmin; height: 15vmin; background: #e53935; border: .6vmin solid #23272e; border-radius: 50%; }
  #titleBug .s { position: absolute; top: 5vmin; left: 11.7vmin; width: .7vmin; height: 13vmin; background: #23272e; border-radius: .4vmin; }
  #titleBug .d { position: absolute; background: #23272e; border-radius: 50%; }
  #titleBug .eye { position: absolute; top: 2.6vmin; width: 1.7vmin; height: 1.7vmin; background: #fff; border-radius: 50%; }
  @keyframes flapL { 0%,100% { transform: rotate(-18deg) scaleY(1); } 50% { transform: rotate(-34deg) scaleY(.78); } }
  @keyframes flapR { 0%,100% { transform: rotate(18deg) scaleY(1); } 50% { transform: rotate(34deg) scaleY(.78); } }

  /* ── 규칙 안내 ─────────────────────────────────────── */
  #rulesBox {
    background: rgba(12,22,46,.72); border: .5vmin solid rgba(255,255,255,.25);
    border-radius: 3vmin; padding: 3.5vmin 5vmin; max-width: 86vw;
  }
  #rulesBox h2 { margin: 0 0 2vmin 0; font-size: 4.4vmin; color: #ffd54f; text-align: center; }
  .ruleLine { display: flex; align-items: center; font-size: 3vmin; line-height: 1.5; }
  .ruleLine + .ruleLine { margin-top: 1.6vmin; }
  .ruleNo {
    width: 5vmin; height: 5vmin; border-radius: 50%; background: #ffd54f; color: #24365c;
    font-size: 2.8vmin; display: flex; align-items: center; justify-content: center;
    margin-right: 2vmin; flex-shrink: 0;
  }
  .hi { color: #ffd54f; }

  /* ── 게임 화면 ─────────────────────────────────────── */
  #screen-game.on { justify-content: flex-start; padding: 0; }
  #gameTop {
    width: 100%; height: 11vmin; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  #timeText { font-size: 5vmin; color: #ffd54f; }
  #timeBarWrap {
    position: absolute; left: 30vw; right: 30vw; bottom: 1vmin; height: 1.4vmin;
    background: rgba(255,255,255,.18); border-radius: .7vmin; overflow: hidden;
  }
  #timeBar { height: 100%; width: 100%; background: #ffd54f; }
  #quitBtn { position: absolute; top: 2vmin; right: 2vmin; }

  #board { width: 100%; flex: 1; display: grid; grid-gap: 1.2vmin; padding: 1.2vmin; }
  #board.p1 { grid-template-columns: 1fr; }
  #board.p2 { grid-template-columns: 1fr 1fr; }
  #board.p3 { grid-template-columns: 1fr 1fr 1fr; }
  #board.p4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  @media (orientation: portrait) {
    #board.p2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    #board.p3 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
  }

  .panel {
    background: #2b4066; border: .5vmin solid rgba(255,255,255,.2);
    border-radius: 2.4vmin; display: flex; flex-direction: column; overflow: hidden;
  }
  .pBar {
    flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
    padding: .8vmin 1.8vmin; font-size: 2.8vmin; background: rgba(0,0,0,.28);
  }
  #board.p1 .pBar { font-size: 3.6vmin; }
  #board.p2 .pBar { font-size: 3vmin; }
  #board.p3 .pBar, #board.p4 .pBar { font-size: 2.5vmin; }
  #board.p1 .goalTag { font-size: 4vmin; }
  #board.p3 .goalTag, #board.p4 .goalTag { font-size: 2.5vmin; }
  .pName { display: flex; align-items: center; }
  .pDot { width: 3vmin; height: 3vmin; border-radius: 50%; margin-right: 1.2vmin; border: .3vmin solid rgba(255,255,255,.6); }
  .pScore { color: #ffd54f; }

  /* 놀이터(하늘) */
  .play {
    flex: 1; position: relative; overflow: hidden;
    background-image: radial-gradient(circle at 50% 108%, #43704f 0%, #34578244 46%, #2b4066 74%);
  }
  .goalTag {
    position: absolute; top: 1.2vmin; left: 50%; transform: translateX(-50%);
    font-size: 3.2vmin;
    background: rgba(10,18,38,.82); border: .35vmin solid #ffd54f; color: #ffd54f;
    border-radius: 1.6vmin; padding: .8vmin 2.4vmin; white-space: nowrap; z-index: 6;
  }
  .goalTag .cnt { color: #fff; }

  /* 먹이 */
  .food { position: absolute; top: 0; left: 0; border-radius: 50%; background: #fff8e1;
          border-style: solid; border-color: #c89a4a; display: flex; align-items: center; justify-content: center;
          color: #4a3208; }
  .play.hint .food.good { border-color: #76ff03; background: #f1ffe0; }
  .food .leaf { position: absolute; background: #4caf50; border-radius: 50% 0 50% 50%; }
  .food.eaten { animation: eat .3s ease-out forwards; }
  @keyframes eat { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.9); opacity: 0; } }

  /* 무당벌레 */
  .bug { position: absolute; top: 0; left: 0; z-index: 5; }
  .bugWing { position: absolute; background: rgba(255,255,255,.34); border-radius: 50%; }
  .bugWL { animation: flapL .18s ease-in-out infinite; }
  .bugWR { animation: flapR .18s ease-in-out infinite; }
  .bugHead { position: absolute; background: #23272e; border-radius: 50%; }
  .bugEye { position: absolute; background: #fff; border-radius: 50%; }
  .bugBody { position: absolute; background: #e53935; border-radius: 50%; border-style: solid; border-color: #23272e; }
  .bugSpine { position: absolute; background: #23272e; border-radius: 1vmin; }
  .bugDot { position: absolute; background: #23272e; border-radius: 50%; }
  .bug.dizzy { animation: dizzy .5s linear infinite; }
  @keyframes dizzy { 0% { filter: none; } 50% { filter: brightness(1.8); } 100% { filter: none; } }

  .fly {
    position: absolute; z-index: 7; font-size: 3vmin; color: #fff;
    text-shadow: 0 .3vmin 0 rgba(0,0,0,.5); animation: fly .8s ease-out forwards;
  }
  .fly.minus { color: #ff8a80; }
  @keyframes fly { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-7vmin); opacity: 0; } }

  .burst {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 5vmin; color: #fff; text-shadow: 0 .5vmin 0 rgba(0,0,0,.4);
    background: rgba(67,160,71,.92); padding: 1.2vmin 4vmin; border-radius: 2vmin;
    display: none; z-index: 8;
  }
  .burst.on { display: block; animation: pop .35s ease-out; }
  @keyframes pop { 0% { transform: translate(-50%,-50%) scale(.4); } 60% { transform: translate(-50%,-50%) scale(1.15); } 100% { transform: translate(-50%,-50%) scale(1); } }

  /* ── 결과 화면 ─────────────────────────────────────── */
  #resultTitle { font-size: 7vmin; color: #ffd54f; }
  #rankList { width: 68vw; }
  .rankRow {
    display: flex; align-items: center; background: rgba(255,255,255,.1);
    border-radius: 2vmin; padding: 1.4vmin 2.4vmin; font-size: 3.4vmin;
  }
  .rankRow + .rankRow { margin-top: 1.4vmin; }
  .medal {
    width: 7vmin; height: 7vmin; border-radius: 50%; color: #3a2c05;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.4vmin; margin-right: 2.4vmin; flex-shrink: 0;
    border: .5vmin solid rgba(255,255,255,.6);
  }
  .rkName { flex: 1; display: flex; align-items: center; }
  .rkScore { color: #ffd54f; font-size: 4vmin; margin-left: 2vmin; }
  .rkSub { color: #cfe0ff; font-size: 2.4vmin; margin-left: 2vmin; }
</style>
</head>
<body>

<div id="orgLogoFixed">
  <img src="assets/gnmc_logo.png" alt="경남수학문화관"
       onerror="document.getElementById('orgLogoFixed').style.display='none'">
</div>

<div id="bgFlowers"></div>

<!-- ① 시작 화면 -->
<div class="screen on" id="screen-start">
  <div class="row">
    <div id="titleBug">
      <div class="wg wgL"></div>
      <div class="wg wgR"></div>
      <div class="h"></div>
      <div class="eye" style="left:9.6vmin"></div>
      <div class="eye" style="left:12.9vmin"></div>
      <div class="b"></div>
      <div class="s"></div>
      <div class="d" style="width:2.6vmin;height:2.6vmin;top:7.4vmin;left:7.4vmin"></div>
      <div class="d" style="width:2.6vmin;height:2.6vmin;top:7.4vmin;left:13.6vmin"></div>
      <div class="d" style="width:2vmin;height:2vmin;top:13vmin;left:8.6vmin"></div>
      <div class="d" style="width:2vmin;height:2vmin;top:13vmin;left:13.2vmin"></div>
    </div>
    <div class="col">
      <div id="titleText">레이디버그 먹이 사냥</div>
      <div id="titleSub">날아다니며 조건에 맞는 수만 먹어요!</div>
    </div>
  </div>
  <div style="height:5vmin"></div>
  <div class="pickLabel">몇 명이 할까요?</div>
  <div style="height:2.5vmin"></div>
  <div class="row" id="pickRow"></div>
</div>

<!-- ② 규칙 안내 -->
<div class="screen" id="screen-rules">
  <div id="rulesBox">
    <h2>이렇게 놀아요</h2>
    <div class="ruleLine"><div class="ruleNo">1</div><div>자기 화면을 <span class="hi">손가락으로 누르거나 끌면</span> 무당벌레가 그쪽으로 날아가요.</div></div>
    <div class="ruleLine"><div class="ruleNo">2</div><div>위에 적힌 <span class="hi">먹이 조건</span>(짝수·홀수·배수 …)에 맞는 열매만 먹으세요.</div></div>
    <div class="ruleLine"><div class="ruleNo">3</div><div>맞는 열매 <span class="hi">+10점</span>, 조건에 맞는 열매를 다 먹으면 <span class="hi">+20점</span>!</div></div>
    <div class="ruleLine"><div class="ruleNo">4</div><div>틀린 열매를 먹으면 <span class="hi">-5점</span>, 잠깐 어지러워서 못 움직여요.</div></div>
    <div class="ruleLine"><div class="ruleNo">5</div><div>초록 테두리 힌트는 1~2판만 계속, 3판은 10초 뒤, <span class="hi">4판부터 없어요.</span></div></div>
    <div class="ruleLine"><div class="ruleNo">6</div><div>제한시간 <span class="hi">2분</span>. 모두 <span class="hi">동시에</span> 날면서 대결해요!</div></div>
  </div>
  <div style="height:4vmin"></div>
  <div class="row">
    <button class="subBtn" id="backBtn">뒤로</button>
    <button class="bigBtn" id="startBtn">시작하기!</button>
  </div>
</div>

<!-- ③ 게임 화면 -->
<div class="screen" id="screen-game">
  <div id="gameTop">
    <div id="timeText">2:00</div>
    <div id="timeBarWrap"><div id="timeBar"></div></div>
    <button class="subBtn" id="quitBtn">그만</button>
  </div>
  <div id="board"></div>
</div>

<!-- ④ 결과 화면 -->
<div class="screen" id="screen-result">
  <div id="resultTitle">시간 끝!</div>
  <div style="height:3vmin"></div>
  <div id="rankList"></div>
  <div style="height:4vmin"></div>
  <button class="bigBtn" id="againBtn">다시 하기</button>
</div>

<script>
(function(){
  'use strict';

  /* ───────── 효과음 (파일 없이 Web Audio) ───────── */
  var actx = null;
  function beep(freq, dur, type, vol){
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended' && actx.resume) actx.resume();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.setValueAtTime(vol || 0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }
  function chord(list){
    for (var i = 0; i < list.length; i++){
      (function(f, d){ setTimeout(function(){ beep(f, 0.12, 'square', 0.07); }, d); })(list[i][0], list[i][1]);
    }
  }

  /* 터치할 때마다 나는 밝은 소리 (도-레-미-솔-라 오름차순) */
  var BLIP = [784, 880, 988, 1175, 1319];
  var blipAt = 0;
  function blip(){
    var f = BLIP[blipAt % BLIP.length];
    blipAt++;
    beep(f, 0.11, 'triangle', 0.05);
    beep(f * 2, 0.07, 'sine', 0.022);
  }

  function mk(tag, cls, parent){
    var d = document.createElement(tag);
    if (cls) d.className = cls;
    if (parent) parent.appendChild(d);
    return d;
  }
  function $(id){ return document.getElementById(id); }
  function onTap(el, fn){
    if (window.PointerEvent){
      el.addEventListener('pointerdown', function(e){ e.preventDefault(); fn(e); });
    } else {
      var touched = false;
      el.addEventListener('touchstart', function(e){ touched = true; e.preventDefault(); fn(e); });
      el.addEventListener('mousedown', function(e){ if (touched) return; e.preventDefault(); fn(e); });
    }
  }

  /* ───────── 설정 ───────── */
  var COLORS = ['#e53935', '#1e88e5', '#43a047', '#f9a825'];
  var NAMES  = ['빨강', '파랑', '초록', '노랑'];
  var GAME_TIME = 120;

  /* 먹이 조건: 쉬운 것(easy) 먼저, 3판부터 전체 */
  var RULES = [
    { t: '짝수만',          easy: 1, f: function(n){ return n % 2 === 0; } },
    { t: '홀수만',          easy: 1, f: function(n){ return n % 2 === 1; } },
    { t: '10보다 큰 수만',  easy: 1, f: function(n){ return n > 10; } },
    { t: '10보다 작은 수만',easy: 1, f: function(n){ return n < 10; } },
    { t: '2의 배수만',      easy: 0, f: function(n){ return n % 2 === 0; } },
    { t: '3의 배수만',      easy: 0, f: function(n){ return n % 3 === 0; } },
    { t: '4의 배수만',      easy: 0, f: function(n){ return n % 4 === 0; } },
    { t: '5의 배수만',      easy: 0, f: function(n){ return n % 5 === 0; } }
  ];

  var players = [];
  var playerCount = 1;
  var timeLeft = GAME_TIME;
  var tickId = null;
  var rafId = null;
  var lastFrame = 0;
  var running = false;

  /* ───────── 화면 전환 ───────── */
  function goto(id){
    var all = document.querySelectorAll('.screen');
    for (var i = 0; i < all.length; i++) all[i].className = 'screen';
    $(id).className = 'screen on';
  }

  (function buildPick(){
    var row = $('pickRow');
    for (var i = 1; i <= 4; i++){
      (function(n){
        var b = mk('button', 'pickBtn', row);
        mk('div', 'num', b).innerHTML = n;
        mk('div', 'cap', b).innerHTML = '명';
        onTap(b, function(){ playerCount = n; goto('screen-rules'); });
      })(i);
    }
  })();

  onTap($('backBtn'),  function(){ goto('screen-start'); });
  onTap($('startBtn'), function(){ startGame(); });
  onTap($('quitBtn'),  function(){ endGame(); });
  onTap($('againBtn'), function(){ goto('screen-start'); });

  /* ───────── 게임 시작 ───────── */
  function startGame(){
    var board = $('board');
    board.innerHTML = '';
    board.className = 'p' + playerCount;
    players = [];

    for (var i = 0; i < playerCount; i++){
      var p = {
        n: i, score: 0, round: 0, cleared: 0, mistakes: 0,
        x: 0, y: 0, tx: 0, ty: 0, dizzyUntil: 0,
        foods: [], goodLeft: 0, rule: null,
        usedHint: false, hintOn: false, roundStart: 0,
        w: 0, h: 0, bugSize: 0, foodSize: 0
      };
      p.panel = mk('div', 'panel', board);
      var bar  = mk('div', 'pBar', p.panel);
      var nm   = mk('div', 'pName', bar);
      mk('div', 'pDot', nm).style.background = COLORS[i];
      mk('span', '', nm).innerHTML = (playerCount === 1 ? '나' : NAMES[i]);
      p.scoreEl = mk('div', 'pScore', bar);
      p.play  = mk('div', 'play', p.panel);
      p.flowers = mk('div', 'flowerLayer', p.play);
      p.goalEl = mk('div', 'goalTag', p.play);
      p.burst = mk('div', 'burst', p.play);

      /* 무당벌레 만들기 */
      p.bug   = mk('div', 'bug', p.play);
      p.wingL = mk('div', 'bugWing bugWL', p.bug);
      p.wingR = mk('div', 'bugWing bugWR', p.bug);
      p.head  = mk('div', 'bugHead', p.bug);
      p.eye1  = mk('div', 'bugEye', p.bug);
      p.eye2  = mk('div', 'bugEye', p.bug);
      p.body  = mk('div', 'bugBody', p.bug);
      p.spine = mk('div', 'bugSpine', p.bug);
      p.dots  = [];
      for (var d = 0; d < 4; d++) p.dots.push(mk('div', 'bugDot', p.bug));

      players.push(p);
    }

    timeLeft = GAME_TIME;
    updateTime();
    goto('screen-game');
    /* 화면이 보이게 된 뒤에 크기를 계산해야 함 (숨겨진 요소는 크기가 0) */
    measureAll();
    for (var k = 0; k < players.length; k++){
      players[k].x = players[k].w / 2;
      players[k].y = players[k].h / 2;
      players[k].tx = players[k].x;
      players[k].ty = players[k].y;
      newRound(players[k]);
    }
    setTimeout(measureAll, 80);

    running = true;
    if (tickId) clearInterval(tickId);
    tickId = setInterval(tick, 200);
    lastFrame = Date.now();
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  /* ───────── 크기 계산 (aspect-ratio 대신 JS) ───────── */
  function measureAll(){
    for (var i = 0; i < players.length; i++) measureOne(players[i]);
  }

  function measureOne(p){
    var w = p.play.clientWidth, h = p.play.clientHeight;
    if (!w || !h) return;
    var oldW = p.w, oldH = p.h;
    p.w = w; p.h = h;
    var small = Math.min(w, h);
    p.bugSize  = Math.max(48, small * 0.20);
    p.foodSize = Math.max(38, small * 0.155);

    /* 화면이 바뀌면 좌표를 비율로 옮김 */
    if (oldW && oldH){
      var rx = w / oldW, ry = h / oldH;
      p.x *= rx; p.y *= ry; p.tx *= rx; p.ty *= ry;
      for (var i = 0; i < p.foods.length; i++){ p.foods[i].x *= rx; p.foods[i].y *= ry; }
    }
    scatterFlowers(p.flowers, w, h, 14, small * 0.075, small * 0.16, 0.34, true);
    drawBugParts(p);
    for (var j = 0; j < p.foods.length; j++) sizeFood(p, p.foods[j]);
  }

  function drawBugParts(p){
    var s = p.bugSize;
    p.bug.style.width = s + 'px';
    p.bug.style.height = s + 'px';

    var bw = s * 0.62, bh = s * 0.72;
    p.body.style.width = bw + 'px';
    p.body.style.height = bh + 'px';
    p.body.style.left = ((s - bw) / 2) + 'px';
    p.body.style.top = (s * 0.26) + 'px';
    p.body.style.borderWidth = Math.max(2, s * 0.035) + 'px';

    var hw = s * 0.42, hh = s * 0.30;
    p.head.style.width = hw + 'px';
    p.head.style.height = hh + 'px';
    p.head.style.left = ((s - hw) / 2) + 'px';
    p.head.style.top = (s * 0.08) + 'px';

    var ew = s * 0.085;
    p.eye1.style.width = p.eye2.style.width = ew + 'px';
    p.eye1.style.height = p.eye2.style.height = ew + 'px';
    p.eye1.style.top = p.eye2.style.top = (s * 0.15) + 'px';
    p.eye1.style.left = (s / 2 - hw * 0.26 - ew / 2) + 'px';
    p.eye2.style.left = (s / 2 + hw * 0.26 - ew / 2) + 'px';

    var sw = Math.max(2, s * 0.035);
    p.spine.style.width = sw + 'px';
    p.spine.style.height = (bh * 0.86) + 'px';
    p.spine.style.left = (s / 2 - sw / 2) + 'px';
    p.spine.style.top = (s * 0.30) + 'px';

    var dPos = [[-0.16, 0.40, 0.13], [0.16, 0.40, 0.13], [-0.14, 0.64, 0.10], [0.14, 0.64, 0.10]];
    for (var i = 0; i < 4; i++){
      var dd = p.dots[i], ds = s * dPos[i][2];
      dd.style.width = ds + 'px';
      dd.style.height = ds + 'px';
      dd.style.left = (s / 2 + s * dPos[i][0] - ds / 2) + 'px';
      dd.style.top = (s * dPos[i][1] - ds / 2) + 'px';
    }

    var ww = s * 0.40, wh = s * 0.56;
    p.wingL.style.width = p.wingR.style.width = ww + 'px';
    p.wingL.style.height = p.wingR.style.height = wh + 'px';
    p.wingL.style.top = p.wingR.style.top = (s * 0.20) + 'px';
    p.wingL.style.left = (s / 2 - bw * 0.48 - ww * 0.62) + 'px';
    p.wingR.style.left = (s / 2 + bw * 0.48 - ww * 0.38) + 'px';
  }

  function sizeFood(p, f){
    var s = p.foodSize;
    f.el.style.width = s + 'px';
    f.el.style.height = s + 'px';
    f.el.style.borderWidth = Math.max(2, s * 0.09) + 'px';
    f.el.style.fontSize = (s * 0.46) + 'px';
    f.leaf.style.width = (s * 0.34) + 'px';
    f.leaf.style.height = (s * 0.22) + 'px';
    f.leaf.style.left = (s * 0.50) + 'px';
    f.leaf.style.top = (-s * 0.16) + 'px';
    f.r = s / 2;
  }

  /* ───────── 한 판 만들기 ───────── */
  function newRound(p){
    p.round++;
    for (var i = 0; i < p.foods.length; i++){
      if (p.foods[i].el.parentNode) p.foods[i].el.parentNode.removeChild(p.foods[i].el);
    }
    p.foods = [];

    /* 조건 고르기 — 1~2판은 쉬운 것만 */
    var pool = [];
    for (var r = 0; r < RULES.length; r++){
      if (p.round > 2 || RULES[r].easy) pool.push(RULES[r]);
    }
    p.rule = pool[Math.floor(Math.random() * pool.length)];

    /* 1~20 중에서 맞는 수 / 틀린 수 나누기 */
    var good = [], bad = [];
    for (var n = 1; n <= 20; n++) (p.rule.f(n) ? good : bad).push(n);
    shuffle(good); shuffle(bad);

    var total = Math.min(10, 5 + p.round);
    var gCount = Math.max(3, Math.min(good.length, Math.floor(total * 0.45)));
    var bCount = Math.min(bad.length, total - gCount);

    var list = [];
    for (var a = 0; a < gCount; a++) list.push({ v: good[a], ok: true });
    for (var b = 0; b < bCount; b++) list.push({ v: bad[b], ok: false });
    shuffle(list);

    var speed = 0.35 + p.round * 0.12;
    for (var c = 0; c < list.length; c++) p.foods.push(makeFood(p, list[c].v, list[c].ok, speed));

    p.goodLeft = gCount;
    p.usedHint = false;
    p.hintOn = false;
    p.play.className = 'play';
    p.roundStart = Date.now();
    updateBar(p);
  }

  function makeFood(p, value, ok, speed){
    var el = mk('div', 'food' + (ok ? ' good' : ''), p.play);
    var leaf = mk('div', 'leaf', el);
    var txt = mk('span', '', el);
    txt.innerHTML = value;
    var ang = Math.random() * Math.PI * 2;
    var f = {
      el: el, leaf: leaf, v: value, ok: ok, r: p.foodSize / 2, alive: true,
      x: 0, y: 0, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed
    };
    sizeFood(p, f);
    /* 무당벌레·다른 먹이와 너무 가깝지 않게 배치 */
    for (var t = 0; t < 60; t++){
      f.x = f.r + Math.random() * Math.max(1, p.w - f.r * 2);
      f.y = p.h * 0.16 + Math.random() * Math.max(1, p.h * 0.84 - f.r * 2) + f.r;
      if (dist(f.x, f.y, p.x, p.y) < p.bugSize * 1.1) continue;
      var okPlace = true;
      for (var q = 0; q < p.foods.length; q++){
        if (dist(f.x, f.y, p.foods[q].x, p.foods[q].y) < f.r * 2.3){ okPlace = false; break; }
      }
      if (okPlace) break;
    }
    return f;
  }

  /* ───────── 꽃 배경 그리기 ───────── */
  var FLOWER_COLORS = ['#f8bbd0', '#ffffff', '#fff59d', '#e1bee7', '#ffccbc'];

  function makeFlower(parent, x, y, size, rot, color, stemH){
    var fl = mk('div', 'flower', parent);
    fl.style.width = size + 'px';
    fl.style.height = size + 'px';
    fl.style.transform = 'translate(' + (x - size / 2) + 'px,' + (y - size / 2) + 'px) rotate(' + rot + 'deg)';
    if (stemH){
      var st = mk('div', 'stem', fl);
      st.style.width = (size * 0.09) + 'px';
      st.style.height = stemH + 'px';
      st.style.left = (size / 2 - size * 0.045) + 'px';
      st.style.top = (size * 0.45) + 'px';
    }
    var pw = size * 0.40, ph = size * 0.52;
    for (var i = 0; i < 5; i++){
      var pt = mk('div', 'petal', fl);
      pt.style.width = pw + 'px';
      pt.style.height = ph + 'px';
      pt.style.background = color;
      pt.style.left = (size / 2 - pw / 2) + 'px';
      pt.style.top = (size / 2 - ph) + 'px';
      pt.style.transformOrigin = '50% 100%';
      pt.style.transform = 'rotate(' + (i * 72) + 'deg)';
    }
    var cs = size * 0.30;
    var co = mk('div', 'core', fl);
    co.style.width = cs + 'px';
    co.style.height = cs + 'px';
    co.style.left = (size / 2 - cs / 2) + 'px';
    co.style.top = (size / 2 - cs / 2) + 'px';
  }

  /* 가운데는 비우고 가장자리에만 — 게임판 위 글자가 묻히지 않게 */
  function scatterFlowers(parent, w, h, count, minS, maxS, alpha, ground){
    parent.innerHTML = '';
    parent.style.opacity = alpha;
    for (var i = 0; i < count; i++){
      var size = minS + Math.random() * (maxS - minS);
      var x, y, rot, stem = 0;
      if (ground && i % 5 !== 0){
        /* 아래쪽 꽃밭 — 줄기까지 있는 꽃 */
        x = size * 0.4 + Math.random() * Math.max(1, w - size * 0.8);
        y = h * 0.60 + Math.random() * (h * 0.36);
        rot = -10 + Math.random() * 20;
        stem = size * (0.5 + Math.random() * 0.9);
      } else {
        /* 가장자리 — 가운데는 비워 둠 */
        var ang = Math.random() * Math.PI * 2;
        var rad = 0.68 + Math.random() * 0.40;
        x = w / 2 + Math.cos(ang) * (w / 2) * rad;
        y = h / 2 + Math.sin(ang) * (h / 2) * rad;
        rot = Math.random() * 72;
      }
      x = Math.max(size * 0.25, Math.min(w - size * 0.25, x));
      y = Math.max(size * 0.25, Math.min(h - size * 0.25, y));
      makeFlower(parent, x, y, size, rot, FLOWER_COLORS[i % FLOWER_COLORS.length], stem);
    }
  }

  function drawBgFlowers(){
    var w = window.innerWidth, h = window.innerHeight;
    var small = Math.min(w, h);
    scatterFlowers($('bgFlowers'), w, h, 20, small * 0.045, small * 0.10, 0.24, true);
  }
  drawBgFlowers();

  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
  }
  function dist(x1, y1, x2, y2){
    var dx = x1 - x2, dy = y1 - y2;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function updateBar(p){
    p.scoreEl.innerHTML = p.score + '점';
    p.goalEl.innerHTML = p.rule.t + ' 먹기! <span class="cnt">남은 ' + p.goodLeft + '개</span>';
  }

  /* ───────── 손가락 조작 (여러 명 동시) ───────── */
  var pointerOwner = {};

  function panelAt(x, y){
    for (var i = 0; i < players.length; i++){
      var rc = players[i].play.getBoundingClientRect();
      if (x >= rc.left && x <= rc.right && y >= rc.top && y <= rc.bottom) return i;
    }
    return -1;
  }
  function setTarget(i, x, y){
    var p = players[i];
    var rc = p.play.getBoundingClientRect();
    p.tx = Math.max(0, Math.min(p.w, x - rc.left));
    p.ty = Math.max(0, Math.min(p.h, y - rc.top));
  }
  function pStart(id, x, y){
    blip();
    if (!running) return;
    var i = panelAt(x, y);
    if (i < 0) return;
    pointerOwner[id] = i;
    setTarget(i, x, y);
  }
  function pMove(id, x, y){
    if (!running) return;
    var i = pointerOwner[id];
    if (i === undefined) return;
    setTarget(i, x, y);
  }
  function pEnd(id){ delete pointerOwner[id]; }

  if (window.PointerEvent){
    document.addEventListener('pointerdown', function(e){ pStart(e.pointerId, e.clientX, e.clientY); });
    document.addEventListener('pointermove', function(e){ pMove(e.pointerId, e.clientX, e.clientY); });
    document.addEventListener('pointerup', function(e){ pEnd(e.pointerId); });
    document.addEventListener('pointercancel', function(e){ pEnd(e.pointerId); });
  } else {
    document.addEventListener('touchstart', function(e){
      for (var i = 0; i < e.changedTouches.length; i++){
        var t = e.changedTouches[i]; pStart(t.identifier, t.clientX, t.clientY);
      }
    });
    document.addEventListener('touchmove', function(e){
      for (var i = 0; i < e.changedTouches.length; i++){
        var t = e.changedTouches[i]; pMove(t.identifier, t.clientX, t.clientY);
      }
      if (running) e.preventDefault();
    }, { passive: false });
    document.addEventListener('touchend', function(e){
      for (var i = 0; i < e.changedTouches.length; i++) pEnd(e.changedTouches[i].identifier);
    });
    document.addEventListener('mousedown', function(e){ pStart('m', e.clientX, e.clientY); });
    document.addEventListener('mousemove', function(e){ pMove('m', e.clientX, e.clientY); });
    document.addEventListener('mouseup', function(){ pEnd('m'); });
  }

  /* ───────── 프레임 ───────── */
  function loop(){
    if (!running) return;
    var now = Date.now();
    var k = Math.min(3, (now - lastFrame) / 16.7);
    lastFrame = now;
    for (var i = 0; i < players.length; i++) step(players[i], k, now);
    rafId = requestAnimationFrame(loop);
  }

  function step(p, k, now){
    if (!p.w) { measureOne(p); return; }
    var half = p.bugSize / 2;

    /* 무당벌레 날기 */
    var dizzy = now < p.dizzyUntil;
    if (!dizzy){
      var ease = Math.min(0.9, 0.11 * k);
      p.x += (p.tx - p.x) * ease;
      p.y += (p.ty - p.y) * ease;
    }
    p.x = Math.max(half, Math.min(p.w - half, p.x));
    p.y = Math.max(half, Math.min(p.h - half, p.y));

    var tilt = Math.max(-26, Math.min(26, (p.tx - p.x) * 0.35));
    if (dizzy) tilt = (now % 360);
    p.bug.style.transform = 'translate(' + (p.x - half) + 'px,' + (p.y - half) + 'px) rotate(' + tilt + 'deg)';

    /* 먹이 떠다니기 + 먹기 판정 */
    for (var i = 0; i < p.foods.length; i++){
      var f = p.foods[i];
      if (!f.alive) continue;
      f.x += f.vx * k;
      f.y += f.vy * k;
      if (f.x < f.r){ f.x = f.r; f.vx = -f.vx; }
      if (f.x > p.w - f.r){ f.x = p.w - f.r; f.vx = -f.vx; }
      if (f.y < f.r + p.h * 0.13){ f.y = f.r + p.h * 0.13; f.vy = -f.vy; }
      if (f.y > p.h - f.r){ f.y = p.h - f.r; f.vy = -f.vy; }
      f.el.style.transform = 'translate(' + (f.x - f.r) + 'px,' + (f.y - f.r) + 'px)';

      if (!dizzy && dist(f.x, f.y, p.x, p.y) < f.r + half * 0.72) eat(p, f, now);
    }
  }

  function eat(p, f, now){
    f.alive = false;
    f.el.className = f.el.className + ' eaten';
    (function(el){ setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, 320); })(f.el);

    if (f.ok){
      p.score += 10;
      p.goodLeft--;
      beep(880, 0.07, 'square', 0.05);
      popText(p, f, '+10', false);
      updateBar(p);
      if (p.goodLeft <= 0) roundDone(p);
    } else {
      p.mistakes++;
      p.score = Math.max(0, p.score - 5);
      p.dizzyUntil = now + 700;
      p.bug.className = 'bug dizzy';
      (function(pp){ setTimeout(function(){ pp.bug.className = 'bug'; }, 700); })(p);
      beep(160, 0.18, 'sawtooth', 0.05);
      popText(p, f, '-5', true);
      updateBar(p);
    }
  }

  function popText(p, f, txt, minus){
    var t = mk('div', 'fly' + (minus ? ' minus' : ''), p.play);
    t.innerHTML = txt;
    t.style.left = (f.x - f.r) + 'px';
    t.style.top = (f.y - f.r) + 'px';
    setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 820);
  }

  function roundDone(p){
    p.cleared++;
    p.score += 20;
    var bonus = !p.usedHint;
    if (bonus) p.score += 10;
    p.scoreEl.innerHTML = p.score + '점';
    chord([[660, 0], [880, 90], [1180, 180]]);
    p.burst.innerHTML = bonus ? '다 먹었다! +30' : '다 먹었다! +20';
    p.burst.className = 'burst on';
    setTimeout(function(){
      p.burst.className = 'burst';
      if (running) newRound(p);
    }, 800);
  }

  /* ───────── 시간 / 힌트 ───────── */
  var lastSec = -1;
  function tick(){
    if (!running) return;
    timeLeft -= 0.2;
    if (timeLeft <= 0){ timeLeft = 0; updateTime(); endGame(); return; }

    var s = Math.ceil(timeLeft);
    if (s !== lastSec){
      lastSec = s;
      updateTime();
      if (s <= 5 && s > 0) beep(1000, 0.08, 'sine', 0.05);
    }
    for (var i = 0; i < players.length; i++) updateHint(players[i]);
  }

  function updateHint(p){
    var show;
    if (p.round <= 2) show = true;
    else if (p.round === 3) show = (Date.now() - p.roundStart) > 10000;
    else show = false;

    if (show !== p.hintOn){
      p.hintOn = show;
      p.play.className = show ? 'play hint' : 'play';
      if (show) p.usedHint = true;
    }
  }

  function updateTime(){
    var s = Math.ceil(timeLeft);
    var m = Math.floor(s / 60);
    var r = s % 60;
    $('timeText').innerHTML = m + ':' + (r < 10 ? '0' + r : r);
    $('timeBar').style.width = (timeLeft / GAME_TIME * 100) + '%';
    $('timeText').style.color = (s <= 10) ? '#ff8a80' : '#ffd54f';
  }

  /* ───────── 결과 ───────── */
  function endGame(){
    if (!running) return;
    running = false;
    if (tickId) { clearInterval(tickId); tickId = null; }
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    pointerOwner = {};
    chord([[520, 0], [660, 130], [880, 260], [1046, 390]]);

    var list = players.slice(0);
    list.sort(function(a, b){
      if (b.score !== a.score) return b.score - a.score;
      return a.mistakes - b.mistakes;
    });

    var box = $('rankList');
    box.innerHTML = '';
    var medalColor = ['#ffd54f', '#dfe6ea', '#dba36a'];
    for (var i = 0; i < list.length; i++){
      var p = list[i];
      var row = mk('div', 'rankRow', box);
      var md = mk('div', 'medal', row);
      md.innerHTML = (i + 1);
      md.style.background = (i < 3) ? medalColor[i] : 'rgba(255,255,255,.35)';
      var nm = mk('div', 'rkName', row);
      mk('div', 'pDot', nm).style.background = COLORS[p.n];
      mk('span', '', nm).innerHTML = (playerCount === 1 ? '나' : NAMES[p.n]);
      mk('div', 'rkSub', row).innerHTML = '판 완성 ' + p.cleared + '번 · 실수 ' + p.mistakes + '번';
      mk('div', 'rkScore', row).innerHTML = p.score + '점';
    }
    $('resultTitle').innerHTML = (timeLeft <= 0) ? '시간 끝!' : '여기까지!';
    goto('screen-result');
  }

  /* 길게 눌러도 메뉴가 뜨지 않게 */
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  window.addEventListener('resize', function(){ drawBgFlowers(); measureAll(); });
  window.addEventListener('orientationchange', function(){ setTimeout(function(){ drawBgFlowers(); measureAll(); }, 300); });
})();
</script>
</body>
</html>
